[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ownhost"
version = "0.1.0"
description = "Create and manage your own Minecraft and Hytale servers on your own computers"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=12",
    "httpx>=0.27",
    "psutil>=5.9",
]

[project.optional-dependencies]
# The GUI is only needed on the PCs you manage from,
# not on the ones that only host servers (e.g. the homelab).
app = ["PySide6>=6.7", "segno>=1.6"]  # segno: QR code to open the web panel on a phone

[project.scripts]
ownhost-agent = "ownhost.agent.__main__:main"

[project.gui-scripts]
ownhost = "ownhost.app.__main__:main"

[tool.setuptools.packages.find]
include = ["ownhost*"]

[tool.setuptools.package-data]
"ownhost.app" = ["assets/*"]
"ownhost.agent" = ["web/*"]
